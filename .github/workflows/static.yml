<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday 🌸</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Playfair+Display:ital,wght@0,600;1,500&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf3e4;--card:#fffaf0;--ink:#4a3b32;--sage:#8aa17d;--rose:#d98c98;--rose2:#f6d3d7;--gold:#e0b25a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a2420;--card:#352d28;--ink:#f3e6d4;--sage:#a6bf98;--rose:#e8a0ab;--rose2:#5a3a40;--gold:#e8c070}}
:root[data-theme="dark"]{--bg:#2a2420;--card:#352d28;--ink:#f3e6d4;--sage:#a6bf98;--rose:#e8a0ab;--rose2:#5a3a40;--gold:#e8c070}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Playfair Display',Georgia,serif;overflow-x:hidden}
.script{font-family:'Caveat','Segoe Script',cursive;font-weight:700}
nav{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:14px 10px 4px;position:relative;z-index:5}
nav a{font-family:'Caveat',cursive;font-size:20px;color:var(--ink);text-decoration:none;padding:4px 14px;border-radius:99px;background:var(--card);border:2px dashed var(--sage);transition:.2s}
nav a.on,nav a:hover{background:var(--sage);color:#fff;transform:rotate(-2deg)}
.page{display:none;flex-direction:column;align-items:center;text-align:center;padding:18px 20px 60px;max-width:640px;margin:0 auto;position:relative;z-index:2;animation:in .7s ease}
.page.on{display:flex}
@keyframes in{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
h1{font-size:clamp(34px,9vw,58px);margin:10px 0;line-height:1.1}
h2{font-size:clamp(26px,7vw,40px);margin:8px 0}
p{line-height:1.7;font-size:18px;margin:8px 0}
.sub{font-size:28px;color:var(--rose);margin:0}
.card{background:var(--card);border:2px solid var(--rose2);border-radius:22px;padding:20px;box-shadow:0 8px 24px rgba(120,80,60,.12);width:100%;box-sizing:border-box}
.btn{font-family:'Caveat',cursive;font-size:24px;border:none;background:var(--rose);color:#fff;padding:8px 26px;border-radius:99px;cursor:pointer;margin:14px 6px 0;box-shadow:0 4px 0 rgba(0,0,0,.15);transition:.15s}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.alt{background:var(--sage)}
.big{font-size:90px;animation:bob 3s ease-in-out infinite;display:inline-block}
@keyframes bob{50%{transform:translateY(-12px) rotate(4deg)}}
.petal{position:fixed;top:-40px;z-index:1;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.conf{position:fixed;width:9px;height:14px;z-index:9;pointer-events:none;animation:cf 2.4s ease-out forwards}
@keyframes cf{to{transform:translate(var(--x),105vh) rotate(720deg);opacity:.2}}
/* cake */
.flame{cursor:pointer;transform-origin:center bottom;animation:fl .5s infinite alternate;transition:.4s}
.flame.out{opacity:0;transform:scale(0)}
@keyframes fl{from{transform:scale(1) rotate(-4deg)}to{transform:scale(1.12) rotate(4deg)}}
.reveal{opacity:0;transform:scale(.9);transition:.8s;pointer-events:none;height:0;overflow:hidden}
.reveal.show{opacity:1;transform:none;pointer-events:auto;height:auto;overflow:visible}
/* gifts */
.gifts{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.gift{font-size:76px;background:none;border:none;cursor:pointer;animation:bob 2.6s ease-in-out infinite;padding:0}
.gift:nth-child(2){animation-delay:.5s}.gift:nth-child(3){animation-delay:1s}
.gift.open{animation:pop .6s forwards;cursor:default}
@keyframes pop{50%{transform:scale(1.5) rotate(10deg)}100%{transform:scale(1)}}
/* letter */
.env{font-size:110px;cursor:pointer;background:none;border:none;animation:bob 2.5s ease-in-out infinite}
.reasons{list-style:none;padding:0;margin:10px 0;text-align:left}
.reasons li{background:var(--card);border-left:6px solid var(--rose);border-radius:12px;padding:10px 14px;margin:8px 0;font-size:18px;animation:in .6s}
.opt{display:block;width:100%;margin:8px 0;padding:12px;font:inherit;font-size:18px;background:var(--card);color:var(--ink);border:2px solid var(--sage);border-radius:14px;cursor:pointer;transition:.2s}
.opt:hover{background:var(--rose2)}
.opt.good{background:var(--sage);color:#fff}
.fb{min-height:28px;color:var(--rose);font-size:24px}
.tl{position:relative;width:100%;padding-left:26px;text-align:left;box-sizing:border-box}
.tl:before{content:"";position:absolute;left:8px;top:0;bottom:0;border-left:3px dashed var(--sage)}
.ev{position:relative;margin:0 0 18px;opacity:0;transform:translateY(20px);transition:.7s}
.ev.v{opacity:1;transform:none}
.ev:before{content:"🌸";position:absolute;left:-28px;top:2px;font-size:16px}
.ev b{color:var(--rose);font-size:20px}
.ev p{margin:2px 0}
.gal{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;width:100%;margin:10px 0}
.pol{background:#fffdf7;padding:8px 8px 12px;box-shadow:0 6px 16px rgba(0,0,0,.18);transform:rotate(var(--r));cursor:pointer;color:#4a3b32;transition:.25s}
.pol:hover{transform:rotate(0) scale(1.05)}
.pol .ph{aspect-ratio:1;background:var(--rose2);display:flex;align-items:center;justify-content:center;font-size:54px;overflow:hidden}
.pol img{width:100%;height:100%;object-fit:cover}
.pol span{display:block;margin-top:6px;font-size:20px}
.sc{position:relative;width:100%;height:120px;margin:10px 0;border-radius:16px;overflow:hidden;border:2px solid var(--rose2)}
.sc div{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:10px;background:var(--card);font-size:19px;line-height:1.4}
.sc canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;transition:opacity .8s}
.hero{width:200px;height:200px;border-radius:50%;object-fit:cover;object-position:50% 30%;border:6px solid var(--card);box-shadow:0 8px 24px rgba(120,80,60,.25),0 0 0 4px var(--rose2);animation:bob 3s ease-in-out infinite}
.pol img{object-position:50% 25%}
</style></head>
<body>
<nav id="nav"></nav>

<section class="page" id="home">
  <img class="hero" src="data:image/jpeg;base64,
